<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Serviços Mecânicos</title>
</head>

<body>

    <table border="1" style="width: 600px">

        <!-- TÍTULO -->
        <thead>
            
       
        <tr>
            <th style="background-color: purple; color: white" >Cabeçalho 1</th>
            <th style="background-color: purple; color: white" >Cabeçalho 2</th>
            <th style="background-color: purple; color: white" >Cabeçalho 3</th>
        </tr>

        </thead>

        <!-- CABEÇALHO -->
        <tbody>
            
        <tr>
            <td  style="background-color: black; color: white; height: 40px">Conteúdo 1</td>
            <td>
            <table border="1" style="width: 100%; height: 100%;">
                <tr>
                    <td style="background-color:yellow"> 1 </td>
                    <td style="background-color:red; color:  white; text-align:right"> 2 </td>
                </tr>
                <tr>
                    <td style="background-color:blue; color:  white; text-align:right""> 3 </td>
                    <td style="background-color:lightgreen"> 4 </td>
                </tr>
            </table>
            
            </td>

            <td style="background: linear-gradient(to right, yellow, orange, red, darkred, purple);">Conteúdo 3</td>
        </tr>

        <tr>
            <td  style="background-color: black; color: white; height: 40px">Conteúdo </td>
            <td style="background-image: url('https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQNQ5DvZQ_mJL_tzmyuO1VvEJMCuVVOoZPAcABsjDDCbys1n6Of'); background-size: cover; background-position: center;">
            <td>
            <table border="1" style="width: 100%; height: 100%;">
                <tr>
                    <td style="background-color:orange; text-align:center"> 5 </td>
                    <td style="background-color:pink; color:  black; text-align:left"> 6 </td>
                </tr>
                <tr>
                    <td style="background-color:#c11c84; color:  black; text-align:right""> 3 </td>
                    <td style="background-color:orange; text-align:center"> 8 </td>
                </tr>
            </table>
            
            </td>
        </tr>
        
            

            
       
        </tbody>


        

    </table>

</body>
</html>
