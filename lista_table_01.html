<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Serviços Mecânicos</title>
</head>

<body>

    <table border="1" style="width: 600px">

        <!-- TÍTULO -->
        <tr>
            <th colspan="5" style="background-color: lightgreen">Tabela de Serviços Mecânicos</th>
        </tr>

        <!-- CABEÇALHO -->
        <tr>
            <th rowspan="5" style="background-color: #00CED1">Nacionais</th>
            <th style="background-color: lightgray">Veículos</th>
            <th style="background-color: lightgray">Serviço</th>
            <th style="background-color: lightgray">Tempo Previsto</th>
            <th style="background-color: lightgray">Valor</th>
        </tr>

        <!-- LINHA 1 -->
        <tr>
            <td>Caminhonete S10</td>
            <td>Suspensão</td>
            <td style="text-align:center">3 horas e 25 minutos</td>
            <td style="text-align:right">350,00</td>
        </tr>

        <!-- LINHA 2 -->
        <tr>
            <td>Caminhonete Ranger</td>
            <td >Freio</td>
            <td style="text-align:center">3 horas e 45 minutos</td>
            <td style="text-align:right">200,00</td>
        </tr>

        <!-- LINHA 3 -->
        <tr>
            <td>Caminhonete Hilux</td>
            <td>Troca de Bateria</td>
            <td style="text-align:center">30 minutos</td>
            <td style="text-align:right">25,00</td>
        </tr>

        <!-- LINHA 4 -->
        <tr>
            <td>Caminhonete D10</td>
            <td>Alinhamento</td>
            <td style="text-align:center">1 hora e 40 minutos</td>
            <td style="text-align:right">220,00</td>
        </tr>

    </table>

</body>
</html>
